<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Контролька — тренировки и проверка знаний перед школьными контрольными." />
    <meta name="theme-color" content="#2f4fd8" />
    <meta name="color-scheme" content="light dark" />
    <title>Контролька</title>
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/nunito-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Контролька — на главную">
        <img src="assets/icons/logo.svg" alt="" width="36" height="36" />
        <span class="brand__name">Контролька</span>
      </a>
      <nav id="nav" class="nav" aria-label="Основное меню"></nav>
    </header>
    <main id="main" class="main" tabindex="-1">
      <div id="loading" class="loading" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>Загружаем задания…</span>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>
      <p class="noscript">Для работы Контрольки нужно включить JavaScript.</p>
    </noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
